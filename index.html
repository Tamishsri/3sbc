<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3SBC — Job Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0a0a0a;
    --surface: #111111;
    --card:    #161616;
    --border:  #242424;
    --text:    #ededed;
    --sub:     #a1a1aa;
    --muted:   #52525b;
    --indigo:  #6366f1;
    --emerald: #10b981;
    --amber:   #f59e0b;
    --rose:    #f43f5e;
    --r:       8px;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }

  /* ── NAV ── */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; height:56px; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:100;
  }
  .logo { font-size:15px; font-weight:800; letter-spacing:-0.04em; }
  .logo span { color:var(--indigo); }

  /* ── SEARCH BAR ── */
  .search-bar {
    display:flex; gap:10px; padding:24px 28px 0; flex-wrap:wrap; align-items:flex-end;
  }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:0.05em; }
  .field input, .field select {
    height:40px; padding:0 12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r); color:var(--text); font-size:13px; font-family:inherit;
    outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus { border-color:var(--indigo); }
  .field input { min-width:220px; }
  .btn-search {
    height:40px; padding:0 22px; background:var(--indigo); color:#fff; border:none;
    border-radius:var(--r); font-size:13px; font-weight:600; cursor:pointer;
    transition:opacity .15s; white-space:nowrap;
  }
  .btn-search:hover { opacity:.85; }
  .btn-search:disabled { opacity:.4; cursor:not-allowed; }

  /* ── PILLS ── */
  .presets { display:flex; gap:8px; padding:12px 28px 0; flex-wrap:wrap; }
  .pill {
    height:28px; padding:0 12px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; font-size:12px; color:var(--sub); cursor:pointer;
    transition:all .15s;
  }
  .pill:hover { border-color:var(--indigo); color:var(--indigo); }

  /* ── STATUS BAR ── */
  .status-bar {
    display:flex; align-items:center; gap:12px; padding:14px 28px;
    font-size:12px; color:var(--sub);
  }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status-dot.green { background:var(--emerald); box-shadow:0 0 6px var(--emerald); }
  .status-dot.spin { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── KANBAN ── */
  .kanban { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:0 28px 32px; }
  @media(max-width:900px) { .kanban { grid-template-columns:1fr; } }

  .col { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .col-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--border);
    background:var(--card);
  }
  .col-name { font-size:12px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
  .col-badge {
    height:20px; padding:0 8px; border-radius:10px; font-size:11px; font-weight:700;
    display:flex; align-items:center;
  }
  .col-list { padding:10px; display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto; }

  /* ── JOB CARD ── */
  .jcard {
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; transition:border-color .15s;
  }
  .jcard:hover { border-color:#3a3a3a; }
  .jcard-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; line-height:1.4; }
  .jcard-company { font-size:12px; color:var(--sub); margin-bottom:8px; }
  .jcard-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag {
    display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px;
    border-radius:10px; font-size:11px; background:rgba(255,255,255,.04);
    border:1px solid var(--border); color:var(--sub);
  }
  .tag.green { background:rgba(16,185,129,.08); border-color:rgba(16,185,129,.2); color:var(--emerald); }
  .tag.amber { background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.2); color:var(--amber); }
  .tag.rose  { background:rgba(244,63,94,.08);  border-color:rgba(244,63,94,.2);  color:var(--rose); }
  .btn-apply {
    display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 12px;
    background:var(--indigo); color:#fff; border-radius:6px; font-size:12px;
    font-weight:600; text-decoration:none; transition:opacity .15s;
  }
  .btn-apply:hover { opacity:.8; }

  /* ── EMPTY / LOADING ── */
  .empty { text-align:center; padding:32px 16px; color:var(--muted); font-size:13px; }
  .sk { background:var(--border); border-radius:4px; animation:sk 1.2s ease-in-out infinite; }
  @keyframes sk { 0%,100%{opacity:.4} 50%{opacity:.9} }
  .sk-title { height:14px; width:80%; margin-bottom:8px; }
  .sk-sub   { height:12px; width:50%; margin-bottom:10px; }
  .sk-tag   { height:20px; width:60px; border-radius:10px; display:inline-block; margin-right:6px; }

  /* ── TOAST ── */
  #toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; border:1px solid var(--border); color:var(--text);
    padding:10px 20px; border-radius:8px; font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:9999; white-space:nowrap;
  }
  #toast.show { opacity:1; }
  </style>
</head>
<body>

<header>
  <div class="logo">3<span>S</span>BC — Job Finder</div>
  <div style="font-size:12px;color:var(--sub)">Live job search · LinkedIn + Dice</div>
</header>

<!-- SEARCH BAR -->
<div class="search-bar">
  <div class="field" style="flex:2;min-width:200px">
    <label>Skill / Role</label>
    <input id="inp-skill" type="text" placeholder="e.g. SAP MM, Java Lead, AWS Architect" value="SAP MM"/>
  </div>
  <div class="field" style="flex:2;min-width:200px">
    <label>Location</label>
    <input id="inp-loc" type="text" placeholder="e.g. United States of America" value="United States of America"/>
  </div>
  <div class="field">
    <label>Job Type</label>
    <select id="inp-type">
      <option value="contract" selected>Contract (C2C)</option>
      <option value="contract-w2">Contract (W2)</option>
      <option value="full-time">Full-Time</option>
    </select>
  </div>
  <button class="btn-search" id="btn-search" onclick="doSearch()">🔍 Search Jobs</button>
</div>

<!-- QUICK PRESETS -->
<div class="presets">
  <span style="font-size:12px;color:var(--muted);line-height:28px">Quick:</span>
  <button class="pill" onclick="preset('SAP MM','United States of America')">SAP MM (USA)</button>
  <button class="pill" onclick="preset('SAP FICO','United States of America')">SAP FICO (USA)</button>
  <button class="pill" onclick="preset('Java Developer','New York, NY')">Java (NYC)</button>
  <button class="pill" onclick="preset('AWS Architect','Remote')">AWS Architect (Remote)</button>
  <button class="pill" onclick="preset('Salesforce Developer','Texas')">Salesforce (Texas)</button>
  <button class="pill" onclick="preset('Data Engineer','Chicago, IL')">Data Eng (Chicago)</button>
  <button class="pill" onclick="preset('Python Developer','California')">Python (California)</button>
  <button class="pill" onclick="preset('SAP SD','United States of America')">SAP SD (USA)</button>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">Ready to search</span>
</div>

<!-- KANBAN GRID -->
<div class="kanban" id="kanban">
  <div class="col">
    <div class="col-head">
      <div class="col-name">💼 LinkedIn</div>
      <div class="col-badge" style="background:rgba(10,102,194,.15);color:#0a66c2">0</div>
    </div>
    <div class="col-list"><div class="empty">Enter a skill and click Search</div></div>
  </div>
  <div class="col">
    <div class="col-head">
      <div class="col-name">🎲 Dice</div>
      <div class="col-badge" style="background:rgba(232,93,4,.15);color:#e85d04">0</div>
    </div>
    <div class="col-list"><div class="empty">Enter a skill and click Search</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
const BOARD_META = {
  linkedin: { name:'LinkedIn', icon:'💼', color:'#0a66c2', bg:'rgba(10,102,194,.15)' },
  dice:     { name:'Dice',     icon:'🎲', color:'#e85d04', bg:'rgba(232,93,4,.15)' },
};

function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }

function toast(msg, dur=3500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}

function setStatus(state, text){
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-text');
  dot.className='status-dot' + (state==='loading'?' spin' : state==='ok'?' green' : '');
  txt.textContent=text;
}

function preset(skill, loc){
  document.getElementById('inp-skill').value = skill;
  document.getElementById('inp-loc').value   = loc;
  doSearch();
}

function skeleton(){
  return [1,2,3].map(()=>`
    <div class="jcard">
      <div class="sk sk-title"></div>
      <div class="sk sk-sub"></div>
      <div><span class="sk sk-tag"></span><span class="sk sk-tag"></span></div>
    </div>`).join('');
}

function dayColor(n){
  if(n===0) return 'green';
  if(n<=2)  return 'amber';
  return 'rose';
}

function renderCard(j){
  const dc = dayColor(j.days_ago||0);
  const sal = j.salary && j.salary.trim() ? `<span class="tag">${esc(j.salary)}</span>` : '';
  return `
    <div class="jcard">
      <div class="jcard-title">${esc(j.title)}</div>
      <div class="jcard-company">🏢 ${esc(j.company||'Company')}</div>
      <div class="jcard-meta">
        <span class="tag">📍 ${esc(j.location||'USA')}</span>
        <span class="tag ${dc}">🕐 ${esc(j.posted||'Today')}</span>
        ${sal}
      </div>
      <a class="btn-apply" href="${esc(j.apply_url||j.url||'#')}" target="_blank" rel="noopener">
        Apply on ${esc(j.board_label)} ↗
      </a>
    </div>`;
}

function renderBoard(key, jobs){
  const meta = BOARD_META[key];
  const list = jobs.length
    ? jobs.map(j=>renderCard(j)).join('')
    : `<div class="empty">No jobs found on ${meta.name} for this search</div>`;
  return `
    <div class="col">
      <div class="col-head">
        <div class="col-name">${meta.icon} ${meta.name}</div>
        <div class="col-badge" style="background:${meta.bg};color:${meta.color}">${jobs.length}</div>
      </div>
      <div class="col-list">${list}</div>
    </div>`;
}

async function doSearch(){
  const skill    = document.getElementById('inp-skill').value.trim() || 'SAP MM';
  const location = document.getElementById('inp-loc').value.trim()   || 'United States of America';
  const jobType  = document.getElementById('inp-type').value;
  const btn      = document.getElementById('btn-search');
  const kanban   = document.getElementById('kanban');

  btn.disabled = true;
  btn.textContent = '⏳ Searching…';
  setStatus('loading', `Searching live jobs for "${skill}" in ${location}…`);

  // Show skeletons
  kanban.innerHTML = Object.entries(BOARD_META).map(([k,m])=>`
    <div class="col">
      <div class="col-head">
        <div class="col-name">${m.icon} ${m.name}</div>
        <div class="col-badge" style="background:${m.bg};color:${m.color}">…</div>
      </div>
      <div class="col-list">${skeleton()}</div>
    </div>`).join('');

  try {
    const ctrl = new AbortController();
    const tid  = setTimeout(()=>ctrl.abort(), 50000);
    const res  = await fetch(
      `/api/jobs/search?skill=${encodeURIComponent(skill)}&location=${encodeURIComponent(location)}&job_type=${encodeURIComponent(jobType)}&cache=0`,
      { signal: ctrl.signal }
    );
    clearTimeout(tid);

    if(!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();

    const boards = data.boards || {};
    kanban.innerHTML = Object.keys(BOARD_META).map(k => renderBoard(k, boards[k]||[])).join('');

    const total = data.total || 0;
    setStatus('ok', `Found ${total} real jobs in ${data.elapsed||'?'}s — LinkedIn: ${(boards.linkedin||[]).length}  |  Dice: ${(boards.dice||[]).length}`);
    toast(`✅ ${total} jobs found!`);

  } catch(err){
    console.error(err);
    kanban.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--rose)">
      <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
      <div style="font-weight:700;margin-bottom:8px">Search Failed</div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:16px">${esc(err.message)}</div>
      <button onclick="doSearch()" style="padding:8px 20px;background:var(--indigo);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">🔄 Try Again</button>
    </div>`;
    setStatus('', `Error: ${err.message}`);
    toast('Search failed — click Try Again');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Search Jobs';
  }
}

// Enter key support
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('inp-skill').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
  document.getElementById('inp-loc').addEventListener('keydown',   e=>{ if(e.key==='Enter') doSearch(); });
  doSearch(); // Auto-search on load
});
</script>
</body>
</html>
